name: Deploy ManiFold AdaIN to Azure

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-deploy:
    name: Build Docker Image and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/manifold-adain:latest .

      - name: Push Image to DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/manifold-adain:latest

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/CLI@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp update -n manifold-adain -g TradeFlow-RG --image ${{ secrets.DOCKER_USERNAME }}/manifold-adain:latest --cpu 1.0 --memory 2.0Gi
            az containerapp ingress update -n manifold-adain -g TradeFlow-RG --target-port 7860
