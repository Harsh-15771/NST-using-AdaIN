name: Keep-Alive Ping

on:
  schedule:
    # Runs every 15 minutes to keep the Azure server awake
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows you to manually click a button to run it on GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Azure Web App
        run: |
          echo "Pinging the ManiFold AI website to prevent cold starts..."
          # Replace the URL below with your actual Azure website URL
          curl -s -o /dev/null -w "Response Code: %{http_code}\n" https://manifold-adain.jollydune-fb1d1349.centralindia.azurecontainerapps.io/
